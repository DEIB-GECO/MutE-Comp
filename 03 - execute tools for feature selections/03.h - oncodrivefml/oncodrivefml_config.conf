[genome]
build = 'hg19'

[signature]
method = 'complement'
#       comment to use whole dataset 
# classifier = 'SAMPLE'
#       overridden by the --signature-correction in CLI
# normalize_by_sites = 'whole_exome'

[score]
file = '%(bgdata://genomicscores/caddpack/1.0)'
format = 'pack'
chr = 0
chr_prefix = ""
pos = 1
ref = 2
alt = 3
score = 5

[statistic]
method = 'amean'
discard_mnp = False
#       un-comment to perform sample sample analysis
# per_sample_analysis = 'max'

sampling = 25000 #100000
sampling_max = 250000 #1000000
#       chunks per process in milions (controls memory usage)
sampling_chunk = 100
sampling_min_obs = 10

    [[indels]]
        include = True
        method = 'max'
        max_consecutive = 7

[settings]
#       comment for all cores (overridden by --cores in CLI)
# cores = 1
